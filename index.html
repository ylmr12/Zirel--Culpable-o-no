<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zirel · Asistente de Culpable o No</title>
<meta name="description" content="Zirel, la asistente virtual del juego educativo Culpable o No.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pet:#244653;--petd:#183541;--cream:#FFF0D5;--gold:#E8B65A;--rose:#E9A8A8;--wood:#754C35;--sage:#8BA58B;--brown:#4a2c1c;--ink:#14303a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ink);font:700 16px/1.5 'Nunito',system-ui,sans-serif;color:var(--brown);-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
background:linear-gradient(rgba(24,53,65,.0),rgba(24,53,65,.0)),
 linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px) 0 0/28px 28px,
 radial-gradient(ellipse at 50% 0%,#356272 0%,#244653 55%,#183541 100%);
border-inline:4px solid var(--wood);box-shadow:0 0 0 4px var(--gold) inset}
.spk{position:absolute;width:8px;height:8px;background:var(--gold);opacity:0;animation:tw 4s infinite;pointer-events:none;box-shadow:8px 0 0 var(--gold),-8px 0 0 var(--gold),0 8px 0 var(--gold),0 -8px 0 var(--gold)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.55;transform:scale(1)}}
header{flex:none;position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(#2f5f73,#244653);border-bottom:6px solid var(--gold);box-shadow:0 6px 0 var(--wood)}
.avw{position:relative;flex:none}
.avw img{display:block;width:76px;height:76px;image-rendering:pixelated;border:5px solid var(--gold);background:#183541;box-shadow:0 0 0 3px var(--wood),0 0 22px rgba(232,182,90,.55);animation:bob 1.4s steps(2) infinite}
.avw i{position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;background:#5fd38a;border:3px solid var(--ink);animation:pl 1.6s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(95,211,138,.35)}}
.tt b{display:block;font:700 30px/1 'Pixelify Sans','Nunito',sans-serif;color:var(--gold);letter-spacing:.06em;text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 5px 0 var(--wood)}
.tt small{display:block;margin-top:6px;color:var(--cream);font-size:14px;font-weight:800}
.bd{margin-left:auto;font:700 13px 'Pixelify Sans',sans-serif;background:var(--rose);color:var(--brown);padding:6px 10px;box-shadow:0 0 0 3px var(--wood);white-space:nowrap}
#chat{position:relative;z-index:1;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:18px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;align-items:flex-end;gap:10px;animation:in .28s steps(5)}
.row.u{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.mini{width:38px;height:38px;flex:none;image-rendering:pixelated;border:3px solid var(--gold);background:#183541;border-radius:0}
.m{max-width:min(82%,560px);padding:12px 15px;white-space:pre-wrap;word-wrap:break-word;position:relative}
.m.z{background:var(--cream);color:var(--brown);box-shadow:0 -3px 0 var(--wood),0 3px 0 var(--wood),-3px 0 0 var(--wood),3px 0 0 var(--wood),0 7px 0 rgba(10,25,32,.45),inset 0 0 0 2px #f2d9a8}
.m.u{background:var(--rose);color:var(--brown);box-shadow:0 -3px 0 var(--wood),0 3px 0 var(--wood),-3px 0 0 var(--wood),3px 0 0 var(--wood),0 7px 0 rgba(10,25,32,.45)}
.m a{color:#a8423c;font-weight:800;text-decoration:underline}.m a.btn{color:var(--brown);text-decoration:none;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{display:inline-block;text-decoration:none;font:700 15px 'Pixelify Sans','Nunito',sans-serif;color:var(--brown);background:var(--gold);padding:9px 14px;cursor:pointer;
box-shadow:0 -3px 0 var(--wood),0 3px 0 var(--wood),-3px 0 0 var(--wood),3px 0 0 var(--wood),0 6px 0 #53331f,inset 0 3px 0 #f7d995;transition:transform .08s steps(2)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}.btn:active{transform:translateY(3px)}
.btn.s{background:var(--sage)}
.dots{display:flex;gap:6px;padding:4px 2px}.dots i{width:10px;height:10px;background:var(--wood);animation:dj .9s infinite steps(2)}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dj{50%{transform:translateY(-7px)}}
#f{position:relative;z-index:2;flex:none;display:flex;gap:10px;padding:12px 14px 14px;background:var(--wood);border-top:5px solid var(--gold)}
input{flex:1;min-width:0;border:0;background:var(--cream);color:var(--brown);padding:13px 15px;font:700 16px 'Nunito',sans-serif;box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),inset 0 4px 0 #ecd9b0;outline:none}
input:focus{box-shadow:0 -3px 0 var(--gold),0 3px 0 var(--gold),-3px 0 0 var(--gold),3px 0 0 var(--gold),inset 0 4px 0 #ecd9b0}
input::placeholder{color:#8a6a55}
#f button{border:0;font:700 17px 'Pixelify Sans','Nunito',sans-serif;color:var(--brown);background:var(--gold);padding:0 20px;cursor:pointer;
box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 6px 0 var(--ink),inset 0 4px 0 #f7d995,inset 0 -4px 0 #c48d36}
#f button:hover{filter:brightness(1.08)}#f button:active{transform:translateY(3px)}
#jump{position:absolute;z-index:5;right:16px;bottom:84px;display:none;border:0;cursor:pointer;font:700 15px 'Pixelify Sans','Nunito',sans-serif;color:var(--brown);background:var(--gold);padding:9px 14px;box-shadow:0 -3px 0 var(--wood),0 3px 0 var(--wood),-3px 0 0 var(--wood),3px 0 0 var(--wood),0 6px 0 #53331f;animation:bob 1.2s steps(2) infinite}
#jump.on{display:block}
@media (max-height:560px){header{padding:6px 12px;gap:10px}.avw img{width:44px;height:44px;border-width:3px}.avw i{width:12px;height:12px;right:-4px;bottom:-4px}.tt b{font-size:20px}.tt small{display:none}.bd{display:none}#chat{padding:10px 12px}#f{padding:8px 10px 10px}input{padding:9px 12px}}
@media (max-width:520px){.bd{display:none}.tt b{font-size:26px}.avw img{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>

function norm(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿?¡!.,;:«»"“”()]/g," ").replace(/\s+/g," ").trim()}
function match(t){const n=norm(t);let best=null,sc=0;FAQ.forEach(f=>{let s=0;f.k.forEach(p=>{if(p[0].test(n))s+=p[1]});if(s>sc){sc=s;best=f}});return sc>=3?best:null}
function reply(t){
 const n=norm(t);
 if(n.length<28&&/^(hola+|holi+|buenas|buenos dias|buenas tardes|buenas noches|hey|ola)\b/.test(n))return "¡Holaaa! 💗✨ ¿En qué te ayudo con Culpable o No? Escríbeme tu pregunta y te ayudo.";
 if(n.length<40&&/\bgracias\b/.test(n))return "¡De nada! 💗 Aquí estaré para lo que necesites sobre Culpable o No. ¡A jugar y descubrir! ⚖️";
 if(n.length<30&&/^(adios|chao|chau|hasta luego|nos vemos)\b/.test(n))return "¡Hasta pronto! 💗 Cuando quieras, vuelve a preguntarme. ¡Cada decisión cuenta! ⚖️";
 const f=match(t);return f?f.a:OFF}

const URLRE=/(https?:\/\/[^\s]+)/g;
function openL(e,href){e.preventDefault();let w=null;try{w=window.open(href,"_blank")}catch(_){}if(w){try{w.opener=null}catch(_){}return}const x=href===GM?MAIL:href;try{navigator.clipboard.writeText(x)}catch(_){}add("No pude abrir el enlace desde aquí 😥 Cópialo y pégalo en tu navegador:\n"+x,"z")}
function render(d,t){d.textContent="";t.split(URLRE).forEach(p=>{if(/^https?:\/\//.test(p)){const a=document.createElement("a");a.href=p;a.target="_blank";a.rel="noopener";a.textContent=p;a.onclick=e=>openL(e,p);d.append(a)}else if(p)d.append(document.createTextNode(p))})}
function mk(w,href,txt,cls){const a=document.createElement("a");a.className="btn"+(cls?" "+cls:"");a.href=href;a.target="_blank";a.rel="noopener";a.onclick=e=>openL(e,href);a.textContent=txt;w.append(a)}
function actions(d,t){const w=document.createElement("div");w.className="acts";
 if(t.includes(WEB))mk(w,WEB,"🌐 Ir a la web");
 if(t.includes(GAME))mk(w,GAME,"🎮 Iniciar la aventura","s");
 if(t.includes(IG))mk(w,IG,"📸 Instagram");if(t.includes(XX))mk(w,XX,"✖️ X","s");if(t.includes(TT))mk(w,TT,"🎵 TikTok");if(t.includes(MAIL))mk(w,GM,"✉️ Contactar con Culpable o No");
 if(w.children.length)d.append(w)}
function row(w){const r=document.createElement("div");r.className="row "+w;if(w==="z"){const a=new Image();a.src=AV;a.className="mini";a.alt="";r.append(a)}const d=document.createElement("div");d.className="m "+w;r.append(d);chat.appendChild(r);return d}
let stick=true;
function atBottom(){return chat.scrollHeight-chat.scrollTop-chat.clientHeight<90}
function scroll(f){if(f)stick=true;const go=()=>{chat.scrollTop=chat.scrollHeight;jump()};go();requestAnimationFrame(go);setTimeout(go,120);setTimeout(go,420)}
function jump(){document.getElementById("jump").classList.toggle("on",!atBottom())}
chat.addEventListener("scroll",()=>{stick=atBottom();jump()},{passive:true});
document.getElementById("jump").onclick=()=>{stick=true;chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"})};
if(window.ResizeObserver)new ResizeObserver(()=>{if(stick)chat.scrollTop=chat.scrollHeight;jump()}).observe(chat);
function fit(){const h=window.visualViewport?window.visualViewport.height:window.innerHeight;if(h>0)document.getElementById("app").style.height=h+"px";if(stick)scroll()}
if(window.visualViewport)window.visualViewport.addEventListener("resize",fit);window.addEventListener("resize",fit);fit();
function add(t,w){const d=row(w);render(d,t);if(w==="z")actions(d,t);if(w==="u")stick=true;scroll();return d}
function ask(t){
 add(t,"u");scroll(true);const d=row("z");d.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';scroll(true);
 const r=reply(t);setTimeout(()=>{render(d,r);actions(d,r);stick=true;scroll(true)},Math.min(1100,450+r.length*2))}
function send(){const t=q.value.trim();if(!t)return;q.value="";ask(t);q.focus({preventScroll:true})}
document.getElementById("send").addEventListener("click",send);
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();send()}});
q.addEventListener("focus",()=>setTimeout(()=>scroll(true),300));
add(WELCOME,"z");
